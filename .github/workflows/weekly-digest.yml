name: Weekly neurosurgery digest

on:
  schedule:
    # Friday 10:00 JST = Friday 01:00 UTC
    - cron: "0 1 * * 5"
  workflow_dispatch:
    inputs:
      demo:
        description: "Generate a demo without PubMed/OpenAI"
        required: false
        default: false
        type: boolean
      skip_line:
        description: "Skip LINE notification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neurosurgery-weekly-pages
  cancel-in-progress: false

jobs:
  build-deploy-notify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      DIGEST_PAPER_COUNT: ${{ vars.DIGEST_PAPER_COUNT || '10' }}
      PUBMED_LOOKBACK_DAYS: ${{ vars.PUBMED_LOOKBACK_DAYS || '8' }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate demo
        if: ${{ inputs.demo == true }}
        run: python -m src.main --demo

      - name: Generate weekly digest
        if: ${{ inputs.demo != true }}
        run: python -m src.main

      - name: Save issue archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "Publish weekly neurosurgery digest"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send LINE notification
        if: ${{ inputs.skip_line != true && inputs.demo != true }}
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m src.notify

